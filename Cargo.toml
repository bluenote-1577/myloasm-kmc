[package]
name = "myloasm-kmc"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "On-disk k-mer counter for myloasm: KMC with per-strand counters and a middle-base quality filter"
repository = "https://github.com/bluenote-1577/myloasm-kmc"
keywords = ["bioinformatics", "genomics", "kmer", "myloasm"]
build = "build.rs"

# The binary name carries the interface version that myloasm looks for on PATH. Bump it only when
# the command-line interface or the database format changes incompatibly.
[[bin]]
name = "myloasm-kmc-v1"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
flate2 = "1"

[build-dependencies]
cc = { version = "1", features = ["parallel"] }
pkg-config = "0.3"

[profile.release]
opt-level = 3
